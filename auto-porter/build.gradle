plugins {
    id 'java'
    id 'application'
}

group = 'com.autoporter'
version = '1.3.0-beta'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.formdev:flatlaf:3.6.1'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.github.javaparser:javaparser-core:3.26.2'
    implementation 'org.slf4j:slf4j-simple:2.0.13'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test { useJUnitPlatform() }

application {
    mainClass = 'com.autoporter.AutoPorterMain'
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

jar {
    archiveFileName = "auto-porter-${project.version}.jar"
    manifest {
        attributes(
            'Main-Class': 'com.autoporter.AutoPorterMain',
            'Implementation-Version': project.version
        )
    }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('distZip') {
    archiveFileName = "auto-porter-${project.version}.zip"
}

tasks.named('distTar') {
    archiveFileName = "auto-porter-${project.version}.tar"
}
